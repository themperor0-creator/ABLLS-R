<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تقييم برنامج ABLLS-R الشامل</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-navy: #0F172A;
            --accent-blue: #2563EB;
            --light-bg: #F8FAFC;
            --border-color: #E2E8F0;
            --card-bg: #FFFFFF;
            --text-dark: #1E293B;
            --text-muted: #64748B;
            --success-color: #10B981;
            --warning-bg: #FEF2F2;
            --warning-border: #FCA5A5;
        }

        * {
            box-sizing: border-box;
            font-family: 'Noto Kufi Arabic', 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--light-bg);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .slide-deck {
            width: 100%;
            max-width: 1000px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid var(--border-color);
            overflow: hidden;
            position: relative;
        }

        .slide {
            display: none;
            padding: 40px;
            animation: fadeIn 0.4s ease-in-out;
        }

        .slide.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-section {
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .header-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-navy);
            margin-bottom: 8px;
        }

        .header-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: var(--primary-navy);
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            background-color: #FAFAFA;
            transition: all 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-blue);
            background-color: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .checkbox-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .card-checkbox {
            border: 1px solid var(--border-color);
            padding: 18px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            background: #FAFAFA;
            transition: all 0.2s ease;
        }

        .card-checkbox:hover {
            border-color: var(--accent-blue);
            background: #F0F6FF;
        }

        .card-checkbox input {
            width: 20px;
            height: 20px;
            accent-color: var(--accent-blue);
            margin-top: 2px;
            flex-shrink: 0;
        }

        .domain-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 25px;
        }

        .domain-header {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-navy);
            border-bottom: 2px solid var(--accent-blue);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .item-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px;
            border-bottom: 1px dashed var(--border-color);
            transition: background 0.15s;
            cursor: pointer;
        }

        .item-row:hover {
            background-color: #F8FAFC;
        }

        .item-row input {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-blue);
            margin-top: 3px;
            flex-shrink: 0;
        }

        .btn {
            background-color: var(--accent-blue);
            color: white;
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
            text-align: center;
        }

        .btn:hover {
            background-color: #1D4ED8;
        }

        .btn-print {
            background-color: #10B981;
        }

        .btn-print:hover {
            background-color: #059669;
        }

        .btn-secondary {
            background-color: #64748B;
        }

        .btn-secondary:hover {
            background-color: #475569;
        }

        .actions-bar {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        /* تنسيق الجداول والتقرير النهائي */
        .report-info-box {
            background-color: #F1F5F9;
            border-radius: 8px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 25px;
            font-size: 14px;
            flex-wrap: wrap;
        }

        .report-table-container {
            margin-bottom: 30px;
            overflow-x: auto; /* يجعل الجداول قابلة للتمرير الأفقي على الشاشات الصغيرة جداً */
        }

        .report-table-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary-navy);
            background-color: #E2E8F0;
            padding: 10px 15px;
            border-radius: 6px 6px 0 0;
            border: 1px solid #CBD5E1;
            border-bottom: none;
        }

        table.report-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            background: #FFFFFF;
            border: 1px solid #CBD5E1;
            min-width: 500px; /* لضمان عدم انضغاط الجدول بشدة في الهواتف */
        }

        table.report-table th, table.report-table td {
            border: 1px solid #CBD5E1;
            padding: 10px 12px;
            text-align: right;
            vertical-align: middle;
        }

        table.report-table th {
            background-color: #F8FAFC;
            color: var(--primary-navy);
            font-weight: 700;
        }

        .col-id { width: 10%; text-align: center !important; font-weight: bold; }
        .col-title { width: 30%; font-weight: 600; }
        .col-desc { width: 45%; color: #334155; }
        .col-status { width: 15%; text-align: center !important; }

        .checkbox-cell {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }

        .checkbox-cell input {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* ==================== استعلامات الوسائط لتجاوب الشاشات الصغيرة (Responsive Design) ==================== */
        @media screen and (max-width: 768px) {
            body {
                padding: 10px;
            }

            .slide {
                padding: 20px 15px;
            }

            .header-title {
                font-size: 20px;
            }

            .header-subtitle {
                font-size: 13px;
            }

            .domain-card {
                padding: 15px;
            }

            .actions-bar {
                flex-direction: column-reverse;
                width: 100%;
            }

            .btn {
                width: 100%;
            }

            .report-info-box {
                flex-direction: column;
                gap: 8px;
            }
        }

        /* ==================== إعدادات الطباعة الدقيقة ==================== */
        @media print {
            @page {
                margin: 15mm;
            }

            body {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            .slide-deck {
                box-shadow: none !important;
                border: none !important;
                max-width: 100% !important;
                width: 100% !important;
            }

            .slide {
                display: none !important;
                padding: 0 !important;
            }

            .slide#step3 {
                display: block !important;
            }

            .header-section,
            .actions-bar,
            .no-print {
                display: none !important;
            }

            .report-table-container {
                overflow: visible !important;
            }

            table.report-table {
                min-width: 100% !important;
            }

            .report-info-box {
                border: 1px solid #CBD5E1 !important;
                background-color: #F8FAFC !important;
                -webkit-print-color-adjust: exact;
            }

            table.report-table th {
                background-color: #F1F5F9 !important;
                -webkit-print-color-adjust: exact;
            }

            .report-table-title {
                background-color: #E2E8F0 !important;
                -webkit-print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>

<div class="slide-deck">

    <!-- السلايد 1: البيانات الأولية -->
    <div id="step1" class="slide active">
        <div class="header-section">
            <div class="header-title">نظام تقييم برنامج ABLLS-R الشامل</div>
            <div class="header-subtitle">منصة تقييم واستخراج خطة المهارات غير المتقنة</div>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label for="childName">اسم الطفل:</label>
                <input type="text" id="childName" placeholder="أدخل اسم الطفل رباعياً...">
            </div>
            <div class="form-group">
                <label for="evaluatorName">اسم القائم بالتقييم:</label>
                <input type="text" id="evaluatorName" placeholder="أدخل اسم الأخصائي/المقيم...">
            </div>
        </div>

        <div class="form-group">
            <label>اختر الأبعاد والمركبات المراد قياسها:</label>
            <div class="checkbox-cards">
                <label class="card-checkbox">
                    <input type="checkbox" name="dimension" value="basic" checked>
                    <div>
                        <strong>المهارات الأساسية للتعلم</strong>
                        <div style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">المجالات (A إلى P)</div>
                    </div>
                </label>
                <label class="card-checkbox">
                    <input type="checkbox" name="dimension" value="academic" checked>
                    <div>
                        <strong>المهارات الأكاديمية</strong>
                        <div style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">المجالات (Q إلى T)</div>
                    </div>
                </label>
                <label class="card-checkbox">
                    <input type="checkbox" name="dimension" value="self_care" checked>
                    <div>
                        <strong>مهارات الرعاية الذاتية</strong>
                        <div style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">المجالات (U إلى X)</div>
                    </div>
                </label>
                <label class="card-checkbox">
                    <input type="checkbox" name="dimension" value="motor" checked>
                    <div>
                        <strong>المهارات الحركية</strong>
                        <div style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">المجالات (Y و Z)</div>
                    </div>
                </label>
            </div>
        </div>

        <div class="actions-bar">
            <button class="btn" onclick="goToStep2()">الانتقال لتقييم البنود &larr;</button>
        </div>
    </div>

    <!-- السلايد 2: واجهة التقييم -->
    <div id="step2" class="slide">
        <div class="header-section">
            <div class="header-title">تسجيل استجابات الطفل</div>
            <div class="header-subtitle">ضع علامة (✓) أمام الأهداف التي <b>يتقنها/يعرفها</b> الطفل فقط. (البنود غير المحددة ستظهر تلقائياً في خطة العمل).</div>
        </div>

        <div id="domainsContainer"></div>

        <div class="actions-bar">
            <button class="btn btn-secondary" onclick="goToStep1()">&rarr; السابق</button>
            <button class="btn" onclick="generateReport()">عرض التقرير وجداول النتائج &larr;</button>
        </div>
    </div>

    <!-- السلايد 3: التقرير وجداول النتائج -->
    <div id="step3" class="slide">
        <div class="header-section">
            <div class="header-title">خطة الأهداف والمهارات غير المتقنة</div>
            <div class="header-subtitle">تقرير مفصل حسب المجالات مع خيارات متابعة الإنجاز</div>
        </div>

        <div class="report-info-box" id="reportHeader"></div>

        <div id="reportTablesContainer"></div>

        <div class="actions-bar">
            <button class="btn btn-secondary no-print" onclick="goToStep2()">&rarr; تعديل التقييم</button>
            <button class="btn btn-print no-print" onclick="window.print()">طباعة / حفظ كـ PDF</button>
        </div>
    </div>

</div>

<script>
const abllsData = {
    basic: [
        {
            code: "A",
            name: "التعاون وفعالية المعزز",
            items: [
                { id: "A1", title: "أخذ المعزز حينما يُعرض عليه", text: "حينما يعرض شيء أو نشاط معزز للطفل، فإنه سيأخذه أو يستخدمه." },
                { id: "A2", title: "أخذ المعزز من ضمن اختيارين", text: "حينما يقدم للطفل شيء أو نشاط معزز، ومعه شيء أو نشاط آخر غير معزز، فإنه سيختار الشيء أو النشاط المعزز." },
                { id: "A3", title: "النظر لشيء غير معزز", text: "سينظر الطفل لشئ غير معزز حينما يعرضه عليه المعلم." },
                { id: "A4", title: "أخذ شيء مألوف حينما يقدم إليه", text: "يأخذ الطفل شيئاً مألوفاً حينما يقدم إليه." },
                { id: "A5", title: "يقترب للحصول على المعزز بعد أداء مهمة بسيطة", text: "يقترب الطفل من المعلم عند عرض معزز، ثم يقوم بأداء مهمة بسيطة حتى يحصل عليه." },
                { id: "A6", title: "الاستجابة للتعليمات للحصول على المعزز من المعلم", text: "سيسعى الطفل للحصول على المعزز من المعلم، ولذلك سيقوم بتنفيذ التعليمات التي تطلب منه." },
                { id: "A7", title: "الاستجابة للعديد من المعلمين", text: "يستخدم الطفل مهارات التعميم مع أكثر من معلم." },
                { id: "A8", title: "انتظر التعليمات بدون لمس الأدوات المعروضة أمامه", text: "ينتظر الطفل بهدوء، ويبقى يديه بعيدة عن الأدوات حتى يقدم المعلم له التعليمات المطلوبة." },
                { id: "A9", title: "النظر إلى المعلم للحصول على تعليمات", text: "ينظر الطفل إلى المعلم ليحصل على التعليمات." },
                { id: "A10", title: "فحص الأدوات قبل أداء المهمة", text: "عندما تقدم تعليمات للقيام بمهمة تعليمية، فإن الطفل يفهم التعليمات، ويفحص الأدوات قبل أداء المهمة." },
                { id: "A11", title: "يستجيب بسرعة عند إعطاء التعليمات", text: "يستجيب الطفل سريعاً عندما يقدم المعلم له التعليمات." },
                { id: "A12", title: "يستجيب للمعززات النشاطية (غير المأكولة)", text: "يؤدي الطفل المهام المطلوبة منه، لكي يحصل على لعبة أو أداة أو نشاط مفضل له." },
                { id: "A13", title: "يستجيب للتعزيز غير المنتظم", text: "سيسعي الطفل إلى الحصول علي تعزيز غير منتظم." },
                { id: "A14", title: "التفاعل مع المعلم كتعزيز", text: "يؤدي الطفل المهمة للحصول علي تفاعل ممتع مع المعلم." },
                { id: "A15", title: "يلاحظ تغيرات تعبيرات وجه وصوت المعلم", text: "بعد إنهاء الطفل للمهمة، فإنه سينظر إلى وجه المعلم، ويلاحظ التغييرات في تعبيرات وجهه وصوته، بحيث يفهم منها التأكيد على صحة المهمة التي قام بها." },
                { id: "A16", title: "الاستجابة للمعززات الاجتماعية", text: "للمديح دور فعال كمعزز للطفل." },
                { id: "A17", title: "الانتظار بصورة مناسبة في حالة تأخر تقديم المعزز", text: "سيتمكن الطفل من الانتظار بصورة مناسبة في حالة عدم تقديم المعزز مباشرة بعد أدائه للمهمة المطلوبة منه." },
                { id: "A18", title: "السعي للحصول على الاستحسان عند استكمال المهمة", text: "سيسعى الطفل للحصول على الاستحسان بعد انتهاء المهمة." },
                { id: "A19", title: "الانتهاء من المهمة يقوم بدور المعزز", text: "انتهاء الطفل من مهمة ما وإكمالها، يؤدي دور المعزز الفعال له." }
            ]
        },
        {
            code: "B",
            name: "الأداء البصري",
            items: [
                { id: "B1", title: "بازل ذات قطعة واحدة", text: "عند إعطاء الطفل قطع مفردة ذات أشكال مميزة، فإنه سيضع قطع البازل في مكانها." },
                { id: "B2", title: "وضع القطع المناسبة في صندوق الأشكال", text: "يضع الطفل القطع في الفتحات المماثلة لها في صندوق الأشكال." },
                { id: "B3", title: "مطابقة أشياء متماثلة", text: "حينما يقدم شيء ما للطفل، فإنه سيطابق بينه وبين شيء مماثل له." },
                { id: "B4", title: "مطابقة أشياء مع صور", text: "حينما يعطى الطفل شيئاً، فإنه سيطابق الشيء." },
                { id: "B5", title: "مطابقة صور متماثلة", text: "حينما تقدم صورة ما للطفل، فإنه سيطابق بينها وبين صورة مماثلة لها." },
                { id: "B6", title: "مطابقة صور مع أشياء", text: "حينما يعطى الطفل صورة لشيء ما، فإنه سيطابق الصورة بالشيء المماثل له على الطاولة." },
                { id: "B7", title: "المطابقة بطلاقة", text: "عند عرض مجموعة من الصور أو الأشياء، فإن الطفل سيطابق هذه الصور بالصور المماثلة لها في تتابع سريع." },
                { id: "B8", title: "فرز الأشياء أو الصور غير المتشابهة", text: "حينما يقدم للطفل مجموعة من الأشياء أو الصور غير المتشابهة، فإنه سيفرزها تبعاً للعنصر الذي تنتمي لها على الطاولة." },
                { id: "B9", title: "مطابقة مكعبات على كارت تصميم", text: "حينما يعطى للطفل عدد من المكعبات ومعها كارت للشكل المطلوب تكوينه، فإنه سيضع المكعبات في المكان المناسب على الكارت." },
                { id: "B10", title: "تركيب بازل داخل إطار غير مربع الشكل", text: "عند إعطاء الطفل قطع من البازل، فإنه سيضعها في مكانها داخل إطار غير مربع الشكل." },
                { id: "B11", title: "تركيب بازل داخل إطار مربع الشكل", text: "عند إعطاء الطفل قطع من البازل، فإنه سيضعها في مكانها داخل إطار مربع الشكل." },
                { id: "B12", title: "محاكاة نموذج مكعبات من خلال النظر إلى كارت التصميم", text: "حينما يعطى الطفل كارت تصميم ومكعبات، فإنه سيصمم المكعبات من خلال النظر إلى كارت التصميم، لتكوين الشكل الموجود بالكارت." },
                { id: "B13", title: "مطابقة نمط تتابع بصري", text: "حينما يُقدم للطفل نمط تتابع بصري، وعدة عناصر مماثلة للنمط (مثل مكعبات ملونة)، فإنه سيرتب هذه العناصر مطابقة للنمط الموجود أمامه." },
                { id: "B14", title: "تركيب بازل غير مربع الشكل، وبدون إطار خارجي", text: "عند إعطاء الطفل مجموعة من قطع البازل، فإنه سيركب هذه القطع لتكوين صورة غير مربعة الشكل (قطع البازل لا تركب في إطار)." },
                { id: "B15", title: "تركيب بازل مربع الشكل، وبدون إطار خارجي", text: "عند إعطاء الطفل لعبة الصور المقطعة (بدون إطار)، فإنه سيركب البازل بطريقة صحيحة." },
                { id: "B16", title: "مطابقة بحسب العلاقة", text: "عند إعطاء الطفل عدة عناصر من الأشياء أو الصور، فإنه سيطابق كل عنصر بعنصر آخر ذو علاقة به (مثل مطابقة المضرب بالكرة)." },
                { id: "B17", title: "تصنيف بحسب الوظيفة", text: "عند إعطاء الطفل عدة عناصر (صور أو أشياء)، ووضع عناصر أخرى مماثلة لها في الوظيفة على الطاولة، فإنه سيضع العناصر المعطاة له مع ما يماثلها." },
                { id: "B18", title: "تصنيف حسب السمة (ما يميز الشيء)", text: "عند إعطاء الطفل عدة عناصر (صور أو أشياء)، ووضع عناصر أخرى في سمة أو في جزء مميز على الطاولة، فإنه سيضع العناصر المعطاة له مع ما يشبهها في السمة أو الجزء المميز." },
                { id: "B19", title: "تصنيف حسب الفئة", text: "عند إعطاء الطفل عدة عناصر (صور أو أشياء)، ووضع عناصر أخرى مشتركة معها في الفئة على الطاولة، فإنه سيضع العناصر المعطاة له مع العناصر المشتركة معها في نفس الفئة." },
                { id: "B20", title: "استدعاء تتابع متأخر من الذاكرة", text: "بعد عرض نموذج من الأشياء في تتابع معين ثم إزالة هذا النموذج، فإن الطفل سيتمكن من عمل هذا النموذج بنفس الترتيب." },
                { id: "B21", title: "التعرف المتأخر على شيء عند عرضه مع أشياء أخرى", text: "عند عرض شيء معين وإخفاءه، ثم عرض ثلاثة أشياء أخرى (إحداها هو الشيء المعروض سابقا) فإن الطفل سيتمكن من التعرف عليه." },
                { id: "B22", title: "إكمال نمط التتابع", text: "عند عرض نموذج من عدة أشياء في تتابع معين، فإن الطفل سيتمكن من الاستمرار في إضافة هذه الأشياء وفقاً لتتابع الصحيح." },
                { id: "B23", title: "تكوين نموذج ثلاثي الأبعاد بعد مشاهدته", text: "عند عرض نموذج مكون من مكعبات أو غيرها من العناصر ثلاثية الأبعاد، فإن الطفل سيتمكن من تكوين هذا النموذج (مثل منزل، سيارة)." },
                { id: "B24", title: "سلسلة من المطابقة المرتبطة معه", text: "عندما يضع المعلم أشياء على الطاولة، فإن الطفل سيضع مع كل شيء الشيء الذي تربطه علاقة معه." },
                { id: "B25", title: "التسلسل والترتيب", text: "عند إعطاء الطفل نموذج تسلسل له بداية ونهاية، فإنه سيتمكن من ترتيب عناصر شبيهة بـه." },
                { id: "B26", title: "ترتيب أحداث القصة", text: "سيتمكن الطفل من ترتيب مجموعة من الصور في تتابعها الصحيح." },
                { id: "B27", title: "متاهات بسيطة", text: "سيتمكن الطفل من رسم خط من بداية حتى نهاية متاهة بسيطة." }
            ]
        },
        {
            code: "C",
            name: "اللغة الاستقبالية",
            items: [
                { id: "C1", title: "الاستجابة حينما ينادى على الطفل باسمه", text: "سينظر الطفل أو يأتي لشخص ما حينما يناديه باسمه." },
                { id: "C2", title: "اتباع التعليمات للقيام بنشاط ممتع في البيئة المناسبة", text: "سيتبع الطفل التعليمات للقيام بنشاط ممتع في سياقه الصحيح حينما يطلب منه ذلك." },
                { id: "C3", title: "ينظر للمعزز عندما يطلب منه", text: "سينظر الطفل لعنصر معزز يمسك به المعلم عند إعطائه التعليمات بذلك." },
                { id: "C4", title: "اتباع التعليمات لأخذ أو إمساك شيء معزز", text: "سيأخذ الطفل أو يمسك بمعزز عند تواجد المعزز في أي مكان، تنفيذاً لتعليمات المعلم." },
                { id: "C5", title: "اتباع التعليمات لأخذ أو إمساك شيء مألوف", text: "سيأخذ الطفل أو يمسك بشيء مألوف عند تواجد ذلك الشيء في أي مكان، تنفيذاً لتعليمات المعلم." },
                { id: "C6", title: "اتباع التعليمات للقيام بنشاط ممتع (عندما يكون موجوداً في مكان مختلف)", text: "سيتبع الطفل التعليمات للقيام بنشاط ممتع، حتى إذا ما كان لا يحدث في هذا الوقت أو في هذا المكان." },
                { id: "C7", title: "اتباع التعليمات في مواقف روتينية معتادة", text: "سيتبع الطفل التعليمات للقيام بنشاط معتاد في المواقف الروتينية." },
                { id: "C8", title: "اتباع التعليمات لإعطاء المعلم شيء غير معزز", text: "سيتبع الطفل التعليمات التي تتطلب منه إعطاء المعلم شيء غير معزز." },
                { id: "C9", title: "اتباع التعليمات للقيام بنشاط حركي بسيط", text: "سيتبع الطفل التعليمات للقيام بمهمة حركية بسيطة مثلاً: (صفق، استدر، ارفع ذراعيك لأعلى)." },
                { id: "C10", title: "اتباع التعليمات لأخذ شيء ما في وجود عنصر مشتت", text: "سيأخذ الطفل شيء ما أو يمسكه عند الطلب منه، في ظل وجود عنصر آخر مشتت." },
                { id: "C11", title: "اتباع التعليمات لاختيار معزز في عرض من شيئين", text: "سيختار الطفل شئ معزز محدد، من عنصرين معروضين أمامه حينما يطلب منه ذلك." },
                { id: "C12", title: "اتباع التعليمات لاختيار معزز من شيئين كلاهما معزز", text: "سيتمكن الطفل من اختيار معزز يحدده المعلم من ضمن مجموعة من معززين معروضين أمامه حينما يطلب منه ذلك." },
                { id: "C13", title: "اتباع التعليمات لاختيار شيء مألوف من ضمن اثنان مألوفين", text: "سيتمكن الطفل من اختيار شيء يحدده المعلم من ضمن مجموعة من شيئين مألوفين عند عرضهما عليه، حينما يطلب منه ذلك." },
                { id: "C14", title: "اختيار صورة من صورتين مألوفتين", text: "سيتمكن الطفل من اختيار صورة يحددها المعلم من ضمن مجموعة من صورتين مألوفتين بالنسبة له عند عرضهما عليه، حينما يطلب منه ذلك." },
                { id: "C15", title: "لمس الطفل أعضاء الجسم الخاصة به", text: "سيتمكن الطفل من اتباع التعليمات لمس أعضاء من جسمه حينما يطلب منه ذلك." },
                { id: "C16", title: "اختيار واحد من ستة أشياء أو أكثر على الطاولة", text: "سيختار الطفل شيئاً محدداً حينما يُعرض هذا الشيء ضمن مجموعة من ستة أشياء أو أكثر على طاولة أمامه." },
                { id: "C17", title: "اختيار صورة من ست صور أو أكثر على الطاولة", text: "سيختار الطفل صورة لشيء محدد حينما تعرض هذه الصورة ضمن مجموعة من ست صور أو أكثر على طاولة أمامه، حينما يطلب منه ذلك." },
                { id: "C18", title: "اختيار أشياء أو صور جديدة دون تدريب مكثف", text: "سيتمكن الطفل من اختيار أشياء أو صور كثيرة جديدة دون الحاجة للتدريب أكثر من (5) مرات." },
                { id: "C19", title: "التمييز الاستقبالي بطلاقة", text: "يختار الطفل أو يشير إلى عناصر مألوفة في تتابع سريع، عندما تُعرض عليه ضمن مجموعة أكبر، عندما يطلب المعلم منه ذلك." },
                { id: "C20", title: "تعليمات مختلفة للاختيار (تعليمات مختلفة لنفس الشيء)", text: "سيتمكن الطفل من اختيار الأشياء والصور التي يحددها المعلم مع استخدام مجموعة متنوعة من التعليمات لاختيار هذه الأشياء." },
                { id: "C21", title: "الإشارة لأعضاء الجسم الخاصة بالآخرين أو على الصور", text: "سيتمكن الطفل من اتباع التعليمات بالإشارة إلى أعضاء جسم الآخرين أو لمس صور لأعضاء الجسم." },
                { id: "C22", title: "لمس الملابس الخاصة بالطفل", text: "سيتمكن الطفل من اتباع التعليمات للمس الملابس التي يرتديها." },
                { id: "C23", title: "لمس أجزاء من عناصر", text: "يتبع الطفل التعليمات للمس أجزاء محددة من أشياء أو صور." },
                { id: "C24", title: "اختيار النعت (الصفات)", text: "سيتمكن الطفل من الاختيار ما بين عنصرين متماثلين، ولكن يختلفان في صفة واحدة." },
                { id: "C25", title: "يحدد أشياء باتباع نظرة الآخرين", text: "يحدد الطفل أشياء بالانتباه لاتجاه نظرة عين شخص آخر." },
                { id: "C26", title: "يتبع الإشارات الوصفية", text: "يتبع الطفل الإشارات الوصفية التي يقوم بها المعلم بيديه لكي يأتي أو يقعد أو يقف أو يذهب لمكان، أو تؤدي أفعال معينة." },
                { id: "C27", title: "اتباع التعليمات للذهاب لشخص ما", text: "سيتمكن الطفل من السير خلال الحجرة للذهاب لشخص محدد." },
                { id: "C31", title: "يتبع التعليمات الصحيحة لاختيار العنصر المحدد", text: "سيتبع الطفل التعليمات الصحيحة لاختيار العنصر المحدد عند الطلب منه أن (المس...، قم بالإشارة إلى...، اعطني...، خذ...، احضر...)." },
                { id: "C32", title: "اختيار الشيء المناسب للقيام بنشاط ما، من ضمن عدة أشياء", text: "سيمتثل الطفل للتعليمات للقيام بنشاط بسيط عند تقديم عدة أشياء أحداها يستخدم لأداء هذا النشاط." },
                { id: "C33", title: "يؤدي فعل بأشياء متعددة", text: "يؤدي الطفل فعل محدد باستخدام أشياء متعددة." },
                { id: "C34", title: "التظاهر بالقيام بفعل محدد", text: "سيمتثل الطفل للتعليمات للتظاهر أو تمثيل لأداء فعل محدد." },
                { id: "C35", title: "اختيار صورة من ثلاث صور تصف أفعال", text: "سيختار الطفل صورة تعبر عن فعل معين من ضمن مجموعة من ثلاث صور على طاولة أمامه حينما يطلب منه ذلك." },
                { id: "C36", title: "اختيار صور العلاقات", text: "عند عرض مجموعة من الأشياء أو الصور، واختيار المعلم أحد تلك العناصر، وطرح سؤال ما الذي يصاحب هذا؟ فإن الطفل سيتمكن من تحديد العنصر الذي يستخدم مع ما اختاره المعلم." },
                { id: "C37", title: "الاختيار وفقاً للوظيفة", text: "سيتمكن الطفل من اختيار الأشياء أو الصور حينما يتعرف على وظيفتها." },
                { id: "C38", title: "الاختيار وفقاً للسمة", text: "سيتمكن الطفل من اختيار الأشياء أو الصور حينما يتعرف على سماتها أو أجزائها." },
                { id: "C39", title: "الاختيار وفقاً للفئة", text: "سيتمكن الطفل من اختيار الأشياء أو الصور حينما يتعرف على الفئة التي تنتمي لها." },
                { id: "C40", title: "اختيار عنصرين من مجموعة أكبر", text: "سيختار الطفل عنصرين محددين من مجموعة كبيرة من العناصر معروضة على الطاولة أمامه، حينما يطلب منه ذلك." },
                { id: "C41", title: "اختيار شيئين في تتابع من مجموعة أكبر", text: "سيختار الطفل شيئين أو صورتين محددتين من ضمن مجموعة كبيرة من الصور على طاولة أمامه حينما يطلب منه ذلك." },
                { id: "C42", title: "اختيار صور مهن المجتمع", text: "سيتمكن الطفل من اختيار صور المهن المألوفة داخل نطاق بيئته." },
                { id: "C43", title: "تحديد العناصر المتشابهة في صورة معقدة وبها أشياء كثيرة", text: "سيتمكن الطفل من تحديد العناصر المتشابهة من خلال صورة أكبر وأكثر تعقيداً." },
                { id: "C44", title: "تحديد أشياء من خلال أجزاء منها", text: "سيتمكن الطفل من تحديد الأشياء حينما تعرض عليه فقط أجزاء منها داخل صورة أكبر وأكثر تعقيداً." },
                { id: "C45", title: "تحديد الصورة بناءً على أصواتها", text: "سيختار الطفل صورة ملائمة حينما يسمع الصوت الذي يصاحب هذا الشيء." },
                { id: "C46", title: "اختيار كل أمثلة الشيء", text: "أن يتبع الطفل التعليمات لاختيار كل أمثلة الشيء المحدد." },
                { id: "C47", title: "اختيار شيء واحد به صفتين محددتين", text: "عند عرض مشهداً أو مجموعة متنوعة من الأشياء أو الصور، سيتمكن الطفل من اختيار شيء محدد يتمتع بصفات محددة." },
                { id: "C48", title: "اختيار مجموعة من الأشياء بناءً على صفة مميزة", text: "عند عرض مجموعة من الأشياء، سيستطيع الطفل اختيار عناصر تتشارك في صفة معينة." },
                { id: "C49", title: "اختيار مجموعة من العناصر بناءً على صفتين مميزتين", text: "عند عرض مجموعة متنوعة من الأشياء أو الصور، سيتمكن الطفل من اختيار كل الأشياء أو الصور التي تتمتع بالخاصيتين المحددتين." },
                { id: "C50", title: "اتباع تعليمات بنفس الترتيب", text: "سيتمكن الطفل من اختيار ثلاثة أشياء وفقاً لتتابع محدد." },
                { id: "C51", title: "اتباع التعليمات تتضمن حروف الجر وظروف المكان", text: "سيتمكن الطفل من اتباع التعليمات التي تتضمن حروف الجر أو ظروف المكان." },
                { id: "C52", title: "اتباع تعليمات تتضمن ضمائر", text: "سيتمكن الطفل من اتباع التعليمات التي تتضمن ضمائر." },
                { id: "C53", title: "اختيار صور اماكن أو أنشطة", text: "سيتمكن الطفل من اختيار صور لأماكن أو لأنشطة." },
                { id: "C54", title: "اختيار صور تعبر عن انفعالات", text: "سيتمكن الطفل من اختيار صور وجوه تعبر عن انفعالات مختلفة." },
                { id: "C55", title: "اختيار المتماثل والمختلف", text: "عند عرض شيئين، ثم عرض شيء ثالث يتطابق مع أحد هذين الشيئين السابقين، والطلب من الطفل أن يجد 'المتماثل' أو 'المختلف'، فإنه سيختار الشيء المطلوب." },
                { id: "C56", title: "اختيار اللا أمثلة (اللا ينتمي)", text: "سيتمكن الطفل من اختيار أشياء لا تعد أمثلة لهذه الفئة مثلاً: (ليس بطعام)." },
                { id: "C57", title: "اختيار صور التفاعل الاجتماعي", text: "سيتمكن الطفل من اختيار صور تمثل مجموعة من التفاعلات الاجتماعية مثلاً: (اللعب، الجدال)." }
            ]
        },
        {
            code: "D",
            name: "التقليد الحركي",
            items: [
                { id: "D1", title: "التقليد الحركي باستخدام الأشياء", text: "سيقلد الطفل نشاطاً حركياً مستخدماً شيء ما حينما يطلب منه ذلك." },
                { id: "D2", title: "التقليد الحركي بواسطة تمييز الشيء", text: "سيقلد الطفل نشاطاً حركياً يتطلب تمييزاً لشيء ما حينما يطلب منه ذلك." },
                { id: "D3", title: "تقليد حركي للحركات الكبرى بمساعدة لفظية", text: "سيقلد الطفل الحركات الكبرى عند توفير المحفزات اللفظية حينما يطلب منه ذلك." },
                { id: "D4", title: "تقليد حركات الساق والقدم", text: "سيقلد الطفل أنشطة حركية كبرى تشتمل على حركات الساق والقدم حينما يطلب منه ذلك." },
                { id: "D5", title: "تقليد حركات الذراع واليد", text: "سيقلد الطفل أنشطة حركية كبرى تشتمل على حركات الذراع واليد حينما يطلب منه ذلك." },
                { id: "D6", title: "تمييز تقليد الحركات الثابتة والمتحركة", text: "أن يقلد الطفل أفعال متشابهة تتطلب منه التمييز حسب الطلب سواء كان ثابت أو متحرك." },
                { id: "D7", title: "تقليد أفعال في ظل تنوع التعليمات", text: "أن يقلد الطفل أفعال عندما تستخدم أي من التعليمات المتنوعة التي تدل على أن يقلد فعل." },
                { id: "D8", title: "تقليد الحركات الكبرى من خلال المرأة", text: "أن يقلد الطفل الحركات الكبرى التي يلاحظها في المرأة من الآخرين." },
                { id: "D9", title: "تقليد حركات الرأس", text: "سيقلد الطفل أنشطة حركية كبرى تشتمل على حركات الرأس حينما يطلب منه أن يفعل هذا." },
                { id: "D10", title: "تقليد حركات الفم واللسان", text: "سيقلد الطفل نشاط حركي يشتمل على حركات الفم واللسان حينما يطلب منه أن يفعل هذا." },
                { id: "D11", title: "تقليد حركات الوجه والشفاه في المرأة", text: "يقلد الطفل حركات الوجه والشفاه التي يلاحظها من الآخرين في المرأة عند الطلب." },
                { id: "D12", title: "تقليد حركي للحركات الدقيقة", text: "سيقلد الطفل نشاطاً حركياً دقيقاً حينما يطلب منه ذلك." },
                { id: "D13", title: "تقليد لمس الأشياء في تتابع", text: "أن يقلد الطفل لمس الأشياء في تتابع في نفس الوقت الذي يقوم فيه المعلم بذلك." },
                { id: "D14", title: "تقليد النفخ", text: "أن يقلد الطفل كل من النفخ القصير والمستمر عندما يقوم الآخرين بذلك." },
                { id: "D15", title: "تقليد حركي للأشياء في ظل تغيير سرعتها بالتزامن مع المعلم", text: "يقلد الطفل أنشطة حركية تتضمن التلاعب بالأشياء ومطابقة لسرعة المعلم." },
                { id: "D16", title: "تقليد سرعة فعل باستخدام أشياء فوراً بعد توقف النموذج", text: "أن يقلد الطفل الأنشطة الحركية التي تتضمن التلاعب بالأشياء مطابقة لسرعة نموذج حديث." },
                { id: "D17", title: "تقليد سرعة النشاط الحركي", text: "سيقلد الطفل نشاطاً حركياً كلياً يطابق سرعة النموذج حينما يطلب منه ذلك." },
                { id: "D18", title: "تقليد لمس أشياء في تسلسل متبعاً نموذج", text: "أن يقلد الطفل لمس الأشياء في تتابع بعد قيام المعلم بذلك." },
                { id: "D19", title: "تقليد سلسلة من الأفعال والتحول مع النموذج", text: "أن يقلد الطفل سلسلة من الأفعال الحركية الطويلة من نموذج يتغير فوراً من فعل لآخر متبع المعلم." },
                { id: "D20", title: "تقليد تتابع أنشطة حركية", text: "سيقلد الطفل تتابعاً من الأنشطة الحركية حينما يطلب منه أن يفعل هذا." },
                { id: "D21", title: "تقليد كثافة (شدة أو قوة) الفعل", text: "يقلد الطفل الأنشطة الحركية الكبرى مطابقة لكثافة النموذج." },
                { id: "D22", title: "تقليد عدد تكرار الحركات", text: "يقلد الطفل نفس عدد تكرار الحركات كما النموذج." },
                { id: "D23", title: "تقليد حركي ولفظي في نفس الوقت", text: "أن يقلد الطفل الحركات مع الأصوات." },
                { id: "D24", title: "تقليد سلسلة حركية باستخدام أشياء متعددة", text: "أن يقلد الطفل سلسلة من الأفعال مستخدماً أشياء متعددة عند الطلب." },
                { id: "D25", title: "تقليد الحركات تلقائياً بدون الطلب اللفظي المباشر", text: "سيقلد الطفل نشاطاً حركياً كلياً يقوم به فرد آخر دون أن يطلب منه لفظياً تقليد النشاط وذلك من أجل الاعتراف الاجتماعي بقدرته على التوفيق مع الأنشطة." },
                { id: "D26", title: "تقليد أنشطة الآخرين تلقائياً", text: "سيقلد الطفل بتلقائية نشاطاً حركياً كلياً يقوم به أفراد آخرين غير واقفين أمامه." },
                { id: "D27", title: "تقليد مؤجل", text: "سيتمكن الطفل من عرض الأنشطة التي لاحظها منذ عدة ساعات في بداية اليوم عند الطلب أو عند تحديد الأنشطة." }
            ]
        },
        {

            items: [
                { id: "E1", title: "تقليد مقاطع صوتية مفردة عند الطلب", text: "سيقلد الطفل مقاطع صوتية مفردة حينما تقول له (قل...)." },

                { id: "E7", title: "تقليد مرن وسلس من الصوت الأول للصوت الثاني", text: "يقلد الطفل النموذج، حيث يطيل أو يقصر الصوت الأول وينتقل بسلاسة للصوت الثاني (الصوتين غير منفصلين)." },
                { id: "E8", title: "تقليد مزيج من (ساكن - متحرك)، (متحرك - ساكن)", text: "أن يقلد الطفل تكرار مزيج من الأصوات كما يتطلب منه النموذج (ساكن - متحرك) (متحرك - ساكن)." },

                { id: "E10", title: "تقليد مزيج من (ساكن - متحرك - ساكن)", text: "أن يكرر الطفل مزيج الأصوات (الكلمات) كما يتطلب النموذج من الطفل (ساكن - متحرك - ساكن) (باب - قال - مام)." },
                { id: "E11", title: "تقليد مزيج ساكن", text: "عندما تقدم كلمات تتكون من مزيج ساكن كنموذج للطفل فإنه سيقلد هذه الكلمات بدقة." },

                { id: "E15", title: "تقليد سريع وبطئ للكلمات", text: "أن يكرر الطفل الكلمات التي تطابق سرعة الكلمة المقدمة." },
                { id: "E16", title: "تقليد الكلمات بأصوات مرتفعة ومنخفضة", text: "أن يكرر الطفل الكلمات التي تطابق صوت الكلمة المقدمة." },
                { id: "E17", title: "تقليد الكلمات بأصوات غليظة ورفيعة", text: "أن يكرر الطفل الكلمات المطابقة لنغمة الكلمات المقدمة." },
                { id: "E18", title: "ينقل رسالة قصيرة لشخص آخر", text: "أن يذهب الطفل لشخص ما، ويعيد عليه رسالة قصيرة طلب منه أن يقولها له." },
                { id: "E19", title: "تقليد تلقائي للكلمات", text: "سيقلد الطفل كلمات بصورة تلقائية." },
                { id: "E20", title: "تقليد تلقائي للجمل", text: "سيقلد الطفل الجمل بصورة تلقائية." }

        {
            code: "F",
            name: "الطلب",
            items: [
                { id: "F1", title: "الطلب الطفولي (عند عدم قدرته على استخدام الكلمات أو لغة الإشارة)", text: "سيتمكن الطفل من تحديد الأشياء والأنشطة التي يريدها من خلال الإشارة إليها أو جذبها أو الوقوف بجانبها (وذلك عند عدم قدرته على استخدام الكلمات أو لغة الإشارة)." },
                { id: "F2", title: "طلب المعزز بمساعدة", text: "سيطالب الطفل ما يريد حينما يكون المعزز متوفراً، وعند مساعدته بتلقيد الكلمة أو لغة الإشارة أو إعطاء الصورة له." },
                { id: "F3", title: "طلب المعزز المرئي، مع السؤال 'ماذا تريد؟'", text: "سيطالب الطفل ما يريد في وجود المعزز باستخدام الكلمات أو أشكال التواصل المكمل (كلغة الإشارة أو بيكس)." },
                { id: "F4", title: "طلب المعزز في ظل عدم وجوده، مع السؤال 'ماذا تريد؟'", text: "سيطلب الأشياء التي يريدها في ظل عدم وجودها." },
                { id: "F5", title: "طلبات تلقائية في وجود الشيء", text: "سيطلب الطفل تلقائياً الأشياء التي يريدها عندما يكون الشيء موجود." },
                { id: "F6", title: "طلبات تلقائية مع عدم وجود الشيء", text: "يطلب الطفل تلقائياً أشياء يحتاجها عندما يكون العنصر غير موجود." },
                { id: "F7", title: "طلب مع التواصل بالعين", text: "يقوم الطفل بالتواصل بالعين عندما يطلب من شخص شيء أو نشاط أو معلومة." },
                { id: "F8", title: "مطالبة الآخرين بأداء نشاط ما", text: "سيتمكن الطفل من مطالبة الآخرين بأداء أنشطة محددة." },
                { id: "F9", title: "المطالبة بأشياء ناقصة ولازمة لنشاط ما", text: "سيطلب الطفل الشيء الناقص عند منحه بعض الأشياء اللازمة للقيام بمهام ما لإكمال مهمة." },
                { id: "F10", title: "الطلب بواسطة حركات الرأس أو الكلام (نعم / لا)", text: "سيتمكن الطفل من المطالبة بالأشياء والأنشطة المعروضة أو رفضها مستعيناً بحركات الرأس أو قول (نعم / لا)." },
                { id: "F11", title: "الطلب باستخدام جملة", text: "سيطلب الطفل أشياء أو أنشطة أو معلومات من خلال جملة." },
                { id: "F12", title: "طلب المساعدة", text: "أن يطلب المساعدة من الآخرين عندما يحتاج إليها." },
                { id: "F13", title: "اكتساب طلبات جديدة دون تدريب مكثف", text: "سيتمكن الطفل من اكتساب طلبات جديدة لأشياء أو أنشطة أو معلومات بعد أقل من (5) مرات تدريب." },
                { id: "F14", title: "طلب انتباه الآخرين", text: "سيطلب الطفل من الآخرين الانتباه لأنشطته أو ما يقوم به." },
                { id: "F15", title: "طلب من الآخرين إبعاد شيء ما أو إيقاف نشاط ما", text: "سيطلب الطفل من الآخرين إبعاد شيء ما أو إيقاف نشاط ما." },

                { id: "F17", title: "الطلب باستخدام حروف الجر أو ظرف المكان", text: "سيتمكن الطفل من طلب الأشياء باستخدام حروف الجر أو ظرف المكان مثلاً: (في الصندوق)." },
                { id: "F18", title: "طلب أشياء أو أحداث مستقبلية", text: "سيتمكن الطفل من طلب أشياء أو أنشطة قد يتمكن من الحصول عليها أو القيام بها مستقبلاً." },
                { id: "F19", title: "طلب معلومات باستخدام كلمة 'ما / ماذا'", text: "سيطرح الطفل أسئلة للحصول على معلومات مستخدماً أداة الاستفهام ماذا." },

                { id: "F21", title: "طلب معلومات باستخدام كلمة 'من / لمن'", text: "سيطرح الطفل أسئلة للحصول على معلومات مستخدماً أداة الاستفهام 'من أو لمن'." },
                { id: "F22", title: "الطلب باستخدام الحال", text: "سيتمكن الطفل من طلب الأنشطة باستخدام الحال مثلاً: (ادفعني بسرعة)." },
                { id: "F23", title: "الطلب باستخدام الضمائر", text: "سيتمكن الطفل من طلب الأشياء باستخدام الضمائر (مثلاً: أريد قبعتك)." },

                { id: "F25", title: "طلب معلومات باستخدام كلمة 'متى'", text: "سيطرح الطفل أسئلة للحصول على معلومات مستخدماً أداة الاستفهام متى." },
                { id: "F26", title: "طلب معلومات باستخدام كلمة 'كيف'", text: "سيطرح الطفل أسئلة للحصول على معلومات مستخدماً أداة الاستفهام كيف؟" },
                { id: "F27", title: "طلب معلومات باستخدام 'هل أستطيع، هل، هل يمكن'", text: "سيطرح الطفل أسئلة للحصول على معلومات باستخدام الأسئلة." },
                { id: "F28", title: "طلب معلومات باستخدام كلمة 'لماذا'", text: "سيطرح الطفل أسئلة للحصول على معلومات مستخدماً أداة الاستفهام لماذا." },
                { id: "F29", title: "طلبات تلقائية طوال اليوم", text: "سيطلب الطفل بأسلوب تلقائي أشياء أو أنشطة أو معلومات طوال اليوم." }
            ]
        },
        {
            code: "G",
            name: "التسمية (تسمية الأشياء)",
            items: [
                { id: "G1", title: "تسمية المعززات", text: "سيسمى الطفل الأشياء المعززة إذا سألته 'ما هذا؟'." },
                { id: "G2", title: "تسمية الأشياء المألوفة", text: "سيسمى الأشياء المألوفة الموجودة في بيئته إذا سألته ما هذا؟" },
                { id: "G3", title: "تسمية الأشخاص المألوفين (المحيطين به)", text: "سيسمى الطفل الأشخاص المألوفين في بيئته إذا سألته من هذا فيما يتصل بالشخص المتواجد في بيئته؟" },
                { id: "G4", title: "تسمية صور الأشياء المألوفة عند السؤال ما هذا؟", text: "سيسمى الطفل صورة لأشياء متواجدة عامة في بيئته." },
                { id: "G5", title: "تسمية أسماء أجزاء الجسم", text: "سيسمى الطفل أسماء أجزاء الجسم المألوفة على نفسه أو على الآخرين." },
                { id: "G6", title: "تسمية قطع الملابس", text: "سيستطيع الطفل تسمية قطع الملابس." },
                { id: "G7", title: "تسمية أنشطة مألوفة في البيئة المحيطة", text: "سيسمى الطفل الأنشطة المألوفة في البيئة المحيطة." },
                { id: "G8", title: "تسمية صور لأنشطة مألوفة", text: "سيسمى الطفل صوراً لأنشطة مألوفة." },
                { id: "G9", title: "التسمية بطلاقة", text: "قدرة الطفل على تسمية الأشياء المعروضة في تتابع سريع." },
                { id: "G10", title: "اكتساب تسميات جديدة دون تدريب مكثف", text: "سيتمكن الطفل من تعلم أسماء الأشياء أو الصور من خلال أقل من (5) محاولات تدريب." },
                { id: "G11", title: "تسمية الأشياء باستخدام ضمير المتكلم", text: "سيتمكن الطفل من تسمية الأشياء باستخدام ضمير المتكلم أنا في جمل بسيطة." },
                { id: "G12", title: "تسمية أسماء أجزاء الأشياء أو سماتها", text: "سيتمكن من تسمية أجزاء الأشياء أو سماتها." },
                { id: "G13", title: "تسمية الصفات", text: "سيتمكن الطفل من تسمية الصفات التي تصف الأشياء (اللون، الحجم، الشكل،...). " },
                { id: "G14", title: "تسمية صور العلاقات", text: "عند تقديم مجموعة من الصور وعرض مجموعة أخرى وتسأل الطفل 'ما الذي يتناسب مع ذلك؟' فالطفل سوف يسمى العنصر الذي يرتبط بالصورة التي تعرضها." },
                { id: "G15", title: "تسمية الأشياء عند معرفة وظيفتها", text: "سيتمكن الطفل من تسمية أسماء الأشياء عند إخباره بوظيفة الشيء." },
                { id: "G16", title: "تسمية الأشياء عند معرفة سماتها", text: "سيتمكن الطفل من تسمية الأشياء عند إخباره بسماتها فقط." },

                { id: "G18", title: "تسمية شيئين عند عرضهما معاً", text: "سيتمكن الطفل من تسمية مجموعة من الأشياء التي تعطى له." },
                { id: "G19", title: "تسمية أشياء في صورة", text: "سيتمكن الطفل من تسمية أكثر من شيء من خلال صورة بها هذه الأشياء." },

        {

let currentChildName = "";
let currentEvaluatorName = "";
let selectedDimensions = [];

function showSlide(slideId) {
    document.querySelectorAll('.slide').forEach(slide => {
        slide.classList.remove('active');
    });
    document.getElementById(slideId).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goToStep1() {
    showSlide('step1');
}

function goToStep2() {
    currentChildName = document.getElementById("childName").value.trim();
    currentEvaluatorName = document.getElementById("evaluatorName").value.trim();

    if (!currentChildName) {
        alert("يرجى كتابة اسم الطفل للبدء.");
        return;
    }

    const checkboxes = document.querySelectorAll('input[name="dimension"]:checked');
    selectedDimensions = Array.from(checkboxes).map(cb => cb.value);

    if (selectedDimensions.length === 0) {
        alert("يرجى اختيار بعد واحد على الأقل.");
        return;
    }

    renderAssessmentItems();
    showSlide('step2');
}

function renderAssessmentItems() {
    const container = document.getElementById("domainsContainer");
    container.innerHTML = "";

    selectedDimensions.forEach(dimKey => {
        const domains = abllsData[dimKey] || [];
        domains.forEach(domain => {
            if (domain.items && domain.items.length > 0) {
                const domainCard = document.createElement("div");
                domainCard.className = "domain-card";
                
                let itemsHTML = `<div class="domain-header">المجال (${domain.code}): ${domain.name}</div>`;
                
                domain.items.forEach(item => {
                    itemsHTML += `
                        <label class="item-row">
                            <input type="checkbox" data-domain="${domain.name}" data-code="${domain.code}" data-item-id="${item.id}" data-item-title="${item.title}" data-item-text="${item.text}">
                            <div>
                                <strong>[${item.id}] ${item.title}:</strong>
                                <span style="font-size: 13px; color: #475569; display: block; margin-top: 2px;">${item.text}</span>
                            </div>
                        </label>
                    `;
                });

                domainCard.innerHTML = itemsHTML;
                container.appendChild(domainCard);
            }
        });
    });
}

function generateReport() {
    const allInputs = document.querySelectorAll('#domainsContainer input[type="checkbox"]');
    const unmasteredByDomain = {};

    allInputs.forEach(input => {
        if (!input.checked) {
            const domainKey = `المجال (${input.dataset.code}): ${input.dataset.domain}`;
            if (!unmasteredByDomain[domainKey]) {
                unmasteredByDomain[domainKey] = [];
            }
            unmasteredByDomain[domainKey].push({
                id: input.dataset.itemId,
                title: input.dataset.itemTitle,
                text: input.dataset.itemText
            });
        }
    });

    document.getElementById("reportHeader").innerHTML = `
        <div><strong>اسم الطفل:</strong> ${currentChildName}</div>
        <div><strong>القائم بالتقييم:</strong> ${currentEvaluatorName || "غير محدد"}</div>
    `;

    const tablesContainer = document.getElementById("reportTablesContainer");
    tablesContainer.innerHTML = "";

    const domainKeys = Object.keys(unmasteredByDomain);

    if (domainKeys.length === 0) {
        tablesContainer.innerHTML = `
            <div style="text-align: center; color: var(--success-color); padding: 40px; font-weight: 700;">
                ممتاز! الطفل يتقن جميع المهارات والبنود في المجالات المفحوصة.
            </div>
        `;
    } else {
        domainKeys.forEach(domainTitle => {
            const domainGroup = document.createElement("div");
            domainGroup.className = "report-table-container";

            let tableHTML = `
                <div class="report-table-title">${domainTitle}</div>
                <table class="report-table">
                    <thead>
                        <tr>
                            <th class="col-id">رمز البند</th>
                            <th class="col-title">اسم المهارة / البند</th>
                            <th class="col-desc">الوصف والهدف من المهارة</th>
                            <th class="col-status">ما تم إنجازه</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            unmasteredByDomain[domainTitle].forEach(item => {
                tableHTML += `
                    <tr>
                        <td class="col-id">${item.id}</td>
                        <td class="col-title">${item.title}</td>
                        <td class="col-desc">${item.text}</td>
                        <td class="col-status">
                            <div class="checkbox-cell">
                                <input type="checkbox" title="حدد عند إنجاز الهدف مستقبلاً">
                                <span style="font-size: 11px; color: #64748B;">تم</span>
                            </div>
                        </td>
                    </tr>
                `;
            });

            tableHTML += `
                    </tbody>
                </table>
            `;

            domainGroup.innerHTML = tableHTML;
            tablesContainer.appendChild(domainGroup);
        });
    }

    showSlide('step3');
}
</script>
